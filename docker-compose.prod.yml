# Продакшен: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Снаружи только Caddy (80/443, сертификаты Let's Encrypt сам); frontend/nginx и Postgres наружу не смотрят.
services:
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
