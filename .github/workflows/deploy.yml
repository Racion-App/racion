name: Deploy

# Деплой кода на racion.app после зелёного CI на main (или вручную): rsync на сервер по ssh, там docker compose
# пересобирает образы и перезапускает контейнеры. База рецептов и фото живут в приватных репозиториях data и
# media — они деплоят себя сами (свои workflow), здесь их папки исключены и на сервере не трогаются.
# Секреты: DEPLOY_KEY (ssh-ключ пользователя vadim), DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      - name: Sync
        run: |
          rsync -az --delete \
            --exclude .git --exclude .gitmodules --exclude .github --exclude .env --exclude backups --exclude backup.sh \
            --exclude node_modules --exclude dist --exclude .impeccable \
            --exclude backend/internal/seed/data --exclude frontend/public/images \
            -e "ssh -i ~/.ssh/deploy" ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/racion/
      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/racion
            docker compose build backend
            docker compose build frontend
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null
            sleep 8
            curl -fsS -o /dev/null https://racion.app/healthz && echo "healthz ok"
          '
