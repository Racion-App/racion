# Сканеры: запросы к путям, которых на сайте нет и которые ищут только боты-взломщики
# (.env, .git, wp-login, phpmyadmin, actuator…). Статус ответа не важен: нормальный клиент
# таких путей не просит вообще.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|OPTIONS) /(?:\.env|\.git|\.aws|\.ssh|\.svn|\.DS_Store|\.idea|\.vscode|\.next|wp-(?:login|admin|content|includes|config)|wordpress|xmlrpc\.php|phpmyadmin|pma/|myadmin|actuator|config(?:\.(?:json|yml|yaml|php|js)|/)|\.config|secrets|vendor/phpunit|cgi-bin|admin\.php|shell|backup|dump\.sql|\.sql|solr/|owa/|autodiscover|telescope|server-status|console/|functionRouter|_ignition|\.well-known/(?!acme-challenge|assetlinks|apple-app|security\.txt|change-password|webfinger))[^"]*" \d{3}
ignoreregex =
