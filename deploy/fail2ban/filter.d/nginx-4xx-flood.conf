# Поток ошибок: перебор несуществующих страниц или упор в лимит запросов (429).
# Настоящие поисковые боты не считаем: у них бывают серии 404 по старым ссылкам.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "[^"]*" (?:400|403|404|429|444) \d+ "[^"]*" "(?!.*(?:Googlebot|YandexBot|YandexImages|bingbot|Applebot|DuckDuckBot))[^"]*"
ignoreregex =
