# Джейлы Рациона. Бан растёт с каждым повтором: 30 мин → 1 ч → 1 сутки → неделя (потолок 4 недели).
# Свои сети (VPN-клиенты, docker) не банятся никогда.
[DEFAULT]
ignoreip = 127.0.0.1/8 ::1 10.10.10.0/24 10.30.30.0/24 172.16.0.0/12
bantime = 30m
bantime.increment = true
bantime.multipliers = 1 2 48 336
bantime.maxtime = 4w
bantime.overalljails = true
banaction = iptables-multiport
banaction_allports = iptables-allports

[sshd]
enabled = true
maxretry = 4
findtime = 10m

[nginx-scan]
enabled = true
port = http,https
filter = nginx-scan
logpath = /var/log/nginx/racion.access.log
          /var/log/nginx/access.log
maxretry = 2
findtime = 10m
banaction = %(banaction_allports)s

[nginx-4xx-flood]
enabled = true
port = http,https
filter = nginx-4xx-flood
logpath = /var/log/nginx/racion.access.log
maxretry = 80
findtime = 5m

[nginx-botsearch]
enabled = true
port = http,https
logpath = /var/log/nginx/racion.access.log
          /var/log/nginx/access.log
maxretry = 2
findtime = 10m
banaction = %(banaction_allports)s
