# racion.app: TLS здесь, дальше — nginx фронтенда в контейнере (127.0.0.1:8090): статика, лимиты, боты для
# превью, /api → backend. Зона .app в HSTS-preload, заголовок обязателен. Настоящий адрес клиента уходит
# в X-Forwarded-For, контейнерный nginx доверяет ему только с docker-адресов.
server {
    listen 80;
    listen [::]:80;
    server_name racion.app www.racion.app mail.racion.app;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://racion.app$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.racion.app;
    ssl_certificate     /etc/letsencrypt/live/racion.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/racion.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://racion.app$request_uri;
}

# Два порта фронтенда: при плавном деплое новый контейнер поднимается на свободном, старый уходит после
# проверки здоровья; отказавший порт nginx пропускает мгновенно (connection refused) и берёт живой.
# Кеш страниц каталога и рецептов на 2 часа: их перебирают боты по тысячам сочетаний фильтров.
proxy_cache_path /var/cache/nginx/racion levels=1:2 keys_zone=racion_pages:20m max_size=600m inactive=3h use_temp_path=off;

upstream racion_app {
    server 127.0.0.1:8090 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:8091 max_fails=1 fail_timeout=2s;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name racion.app;
    ssl_certificate     /etc/letsencrypt/live/racion.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/racion.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    client_max_body_size 13m;
    access_log /var/log/nginx/racion.access.log;
    error_log  /var/log/nginx/racion.error.log;

    # Каталог и страницы рецептов без сессии: ключ — адрес со строкой запроса и cookie страны
    # (от неё зависят цены). Запросы с Authorization мимо кеша. Пока бэкенд занят или лежит, отдаём устаревшее.
    location ~ "^/([a-z]{2}/)?(recipes|recipe/[^/]+)$" {
        proxy_pass http://racion_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 90s;
        proxy_cache racion_pages;
        proxy_cache_key "$scheme$host$request_uri|$cookie_racion_country";
        proxy_cache_valid 200 301 2h;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass http://racion_app;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
