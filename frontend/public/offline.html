<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Нет сети — Рацион</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<script src="/theme.js"></script>
</head>
<body>
<div id="root"><div class="shell">
<header class="topbar"><a class="topbar__brand" href="/"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></svg>Рацион</a></header>
<div class="state errpage"><div class="state__box">
  <span class="errpage__icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg></span>
  <h2 data-i18n="offline.title">Нет сети</h2>
  <p data-i18n="offline.text">Страница не открывается без связи. Последние недели и списки покупок доступны в приложении.</p>
  <div class="errpage__actions"><a class="btn btn-primary" href="/" data-i18n="offline.open">Открыть приложение</a><button type="button" class="btn btn-soft" onclick="location.reload()" data-i18n="offline.retry">Попробовать снова</button></div>
</div></div>
</div></div>
<script>
// язык из адреса (/en/…) или браузера; словарь берём из кэша приложения, если он там есть
(function(){var m=location.pathname.match(/^\/([a-z]{2})\//),l=m?m[1]:(navigator.language||"ru").slice(0,2);if(l==="ru")return;
fetch("/api/locales/"+l).then(function(r){return r.json()}).then(function(d){var s=d.strings||d;document.documentElement.lang=l;document.querySelectorAll("[data-i18n]").forEach(function(e){var v=s[e.dataset.i18n];if(v)e.textContent=v})}).catch(function(){})})();
window.addEventListener("online",function(){location.reload()});
</script>
</body>
</html>
