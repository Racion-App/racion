# Лимит на вход и регистрацию по адресу: 10 запросов в минуту, всплеск до 10. Бэкенд считает то же самое,
# nginx отсекает раньше и дешевле.
limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
# Боты мессенджеров и соцсетей получают на страницы приложения ответ бэкенда с og-разметкой (см. /og/ в server.go)
map $http_user_agent $is_bot {
    default 0;
    ~*(TelegramBot|facebookexternalhit|Facebot|Twitterbot|vkShare|WhatsApp|Discordbot|Slackbot|LinkedInBot|Pinterest|SkypeUriPreview|Viber|iMessageLinkPreview|Applebot|Googlebot|bingbot|YandexBot) 1;
}

# Защитные заголовки — одним набором для страниц, SPA и статики.
map $sent_http_content_type $csp {
    default "";
    "~^text/html" "default-src 'self'; script-src 'self' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; font-src 'self' data:; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; frame-src https://mc.yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # тело запроса: JSON квиза и рецептов — десятки килобайт, всё крупнее отсекаем
    client_max_body_size 256k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;
    # HSTS включайте на TLS-терминаторе, когда https подтверждён: add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Адрес клиента: X-Forwarded-For перезаписываем своим значением, чтобы клиент не подсунул чужой IP
    # (по нему считаются лимиты и страна). За Cloudflare или другим прокси замените на их заголовок.
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Бэкенд недоступен — та же страница ошибки, что и у сервера, статикой
    error_page 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; internal; }

    location /api/ {
        client_max_body_size 13m;   # фото до 12 МБ, остальное режет бэкенд
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /healthz {
        proxy_pass http://backend:8080;
    }
    # Страницы рецептов, карта сайта и robots — с бэкенда (обычный HTML для поисковиков).
    # HTML-страницы рецептов на любом языке из backend/locales: /recipes, /es/recipes, /ja/recipe/{id}
    location ~ "^/(([a-z]{2})/)?(recipes|recipe/|collections|collection/|sitemap\.xml|robots\.txt)" {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    # Фото пользователей из MinIO (бакет racion, чтение открыто политикой бакета)
    location /media/ {
        proxy_pass http://minio:9000/racion/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "public, max-age=3600"; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # превью ссылок на страницы приложения: главная, неделя, событие — ботам отдаём бэкенд, людям index.html
    location = / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        if ($is_bot) { rewrite ^ /og/ break; proxy_pass http://backend:8080; }
        try_files /index.html =404;
    }
    location ~ "^/(plan|event)/[^/]+$" {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        if ($is_bot) { rewrite ^(.*)$ /og$1 break; proxy_pass http://backend:8080; }
        try_files /index.html =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
