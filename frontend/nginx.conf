# Лимит на вход и регистрацию по адресу: 10 запросов в минуту, всплеск до 10. Бэкенд считает то же самое,
# nginx отсекает раньше и дешевле.
# За TLS-терминатором (Caddy в той же docker-сети) настоящий адрес клиента — в X-Forwarded-For, схема — в
# X-Forwarded-Proto. Доверяем только адресам docker-сетей; снаружи заголовок не пройдёт.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
map $http_x_forwarded_proto $fwd_proto { default $scheme; https https; }

# Бэкенд по имени через переменную: nginx перечитывает DNS Docker каждые 5 с, поэтому при плавном деплое
# (новый контейнер поднялся, старый ушёл) запросы идут в живой; при ошибке пробует следующий адрес.
resolver 127.0.0.11 valid=5s ipv6=off;

limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
# Запросы с ключом API (Bearer rk_…, их выдают только админам) лимит не считают: пустой ключ зоны = без лимита
map $http_authorization $api_limit_key {
    default $binary_remote_addr;
    "~^Bearer rk_" "";
}
limit_req_zone $api_limit_key zone=api:10m rate=20r/s;
# Боты мессенджеров и соцсетей получают на страницы приложения ответ бэкенда с og-разметкой (см. /og/ в server.go)
map $http_user_agent $is_bot {
    default 0;
    # только боты превью ссылок (мессенджеры и соцсети). Поисковые роботы получают обычные страницы:
    # у каталога и рецептов — серверный HTML, у приложения — index.html со статичным описанием и ссылками.
    ~*(TelegramBot|facebookexternalhit|Facebot|Twitterbot|vkShare|WhatsApp|Discordbot|Slackbot|LinkedInBot|Pinterest|SkypeUriPreview|Viber|iMessageLinkPreview) 1;
}

# Защитные заголовки — одним набором для страниц, SPA и статики.
map $sent_http_content_type $csp {
    default "";
    "~^text/html" "default-src 'self'; script-src 'self' https://*.yandex.ru https://*.yandex.com https://yastatic.net https://*.yastatic.net https://www.googletagmanager.com 'sha256-UgtD6nH9shfGnpUntr3lT82OaytSJIgDXzwjGad7D0g=' 'sha256-hhVv/x+kh/UMSaYbVphN2C2cFoxzjcgKg4VfiMjfzNo=' 'sha256-D4vyR+/g5bDAqn/sSrHZ/G7NuI4RH6v6I+uWQZvgbfc='; style-src 'self' 'unsafe-inline' https://yastatic.net https://*.yastatic.net; img-src 'self' data: https://*.yandex.ru https://*.yandex.com https://yastatic.net https://*.yastatic.net https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self' data: https://yastatic.net; connect-src 'self' https://*.yandex.ru https://*.yandex.com wss://*.yandex.ru wss://*.yandex.com https://yastatic.net https://*.yastatic.net https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src https://*.yandex.ru https://*.yandex.com https://www.googletagmanager.com; frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.com https://webvisor.com; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    proxy_next_upstream error timeout http_502 http_503;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # тело запроса: JSON квиза и рецептов — десятки килобайт, всё крупнее отсекаем
    client_max_body_size 256k;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;
    # HSTS включайте на TLS-терминаторе, когда https подтверждён: add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Адрес клиента: X-Forwarded-For перезаписываем своим значением, чтобы клиент не подсунул чужой IP
    # (по нему считаются лимиты и страна). За Cloudflare или другим прокси замените на их заголовок.
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        set $backend "backend"; proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    # Бэкенд недоступен — та же страница ошибки, что и у сервера, статикой
    error_page 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; internal; }

    location /api/ {
        client_max_body_size 65m;   # фото до 12 МБ файлом, пакет рецептов с base64-фото до 64 МБ; остальное режет бэкенд
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        set $backend "backend"; proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location ~ "^/\.well-known/(ard|ai-catalog)\.json$" {
        set $backend "backend"; proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location ~ "^/og/(recipe|collection)/" {
        set $backend "backend"; proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location /healthz {
        set $backend "backend"; proxy_pass http://$backend:8080;
    }
    # Страницы рецептов, карта сайта и robots — с бэкенда (обычный HTML для поисковиков).
    # HTML-страницы рецептов на любом языке из backend/locales: /recipes, /es/recipes, /ja/recipe/{id}
    location ~ "^/(([a-z]{2})/)?(recipes|recipe/|collections|collection/|cook|terms|privacy|status|sitemap\.xml|sitemap/|[0-9a-f]{32}\.txt|robots\.txt|llms\.txt)" {
        set $backend "backend"; proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    # Фото пользователей из MinIO (бакет racion, чтение открыто политикой бакета)
    location /media/ {
        proxy_pass http://minio:9000/racion/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js { add_header Cache-Control "no-cache"; }
    # метка сборки для проверки обновлений PWA: никогда из кэша
    location = /version.json { add_header Cache-Control "no-store"; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "public, max-age=3600"; }

    # Имена бандлов постоянные (/assets/app.js, app.css — их подключают и SSR-страницы), поэтому не immutable:
    # браузер проверяет ETag при каждом заходе (304 — дёшево), и после деплоя все получают новую версию сразу.
    location /assets/ {
        etag on;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # превью ссылок на страницы приложения: главная, неделя, событие — ботам отдаём бэкенд, людям index.html
    location = / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        if ($is_bot) { rewrite ^ /og/ break; set $backend "backend"; proxy_pass http://$backend:8080; }
        try_files /index.html =404;
    }
    location ~ "^/(plan|event)/[^/]+$" {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        if ($is_bot) { rewrite ^(.*)$ /og$1 break; set $backend "backend"; proxy_pass http://$backend:8080; }
        try_files /index.html =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
