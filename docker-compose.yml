services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-racion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-racion}
      POSTGRES_DB: ${POSTGRES_DB:-racion}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # только с этой машины: наружу Postgres не смотрит
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-racion} -d ${POSTGRES_DB:-racion}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-racion}:${POSTGRES_PASSWORD:-racion}@db:5432/${POSTGRES_DB:-racion}?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      BASE_URL: ${BASE_URL:-}
      METRIKA_ID: ${VITE_METRIKA_ID:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      IMAGES_DIR: /images
      GEO_DIR: /geo
      PUSH_CONTACT: ${PUSH_CONTACT:-mailto:admin@racion.app}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Racion <info@racion.app>}
      # вход через внешние сервисы: пустая пара выключает кнопку
      OAUTH_VK_ID: ${OAUTH_VK_ID:-}
      OAUTH_VK_SECRET: ${OAUTH_VK_SECRET:-}
      OAUTH_YANDEX_ID: ${OAUTH_YANDEX_ID:-}
      OAUTH_YANDEX_SECRET: ${OAUTH_YANDEX_SECRET:-}
      OAUTH_GOOGLE_ID: ${OAUTH_GOOGLE_ID:-}
      OAUTH_GOOGLE_SECRET: ${OAUTH_GOOGLE_SECRET:-}
      OAUTH_GITHUB_ID: ${OAUTH_GITHUB_ID:-}
      OAUTH_GITHUB_SECRET: ${OAUTH_GITHUB_SECRET:-}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
      OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
      OAUTH_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-}
      OAUTH_APPLE_KEY: ${OAUTH_APPLE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LOCAL_AI_URL: ${LOCAL_AI_URL:-}
      AI_ORDER: ${AI_ORDER:-}
      AI_MODELS: ${AI_MODELS:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-racion}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-racion-secret}
      S3_BUCKET: ${S3_BUCKET:-racion}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-/media}
    volumes:
      - ./frontend/public/images:/images:ro   # фото блюд для карточек превью ссылок
      - geodata:/geo                          # база городов DB-IP (~130 МБ), чтобы не качать при каждом деплое
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Фото пользователей: S3-совместимое хранилище. В продакшене можно заменить на любой S3 (Selectel, Yandex, AWS),
  # тогда minio не нужен — достаточно S3_* переменных.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-racion}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-racion-secret}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_METRIKA_ID: ${VITE_METRIKA_ID:-}
    ports:
      - "${WEB_PORTS:-8090-8091}:80"   # два порта, чтобы при плавном деплое рядом жили старый и новый контейнер
    volumes:
      - ./frontend/public/images:/usr/share/nginx/html/images:ro   # фото рецептов подхватываются без пересборки
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/favicon.svg"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  geodata:
