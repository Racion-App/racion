{{template "head" .}}
<div class="state errpage"><div class="state__box">
  <span class="errpage__icon" aria-hidden="true">
    {{if eq .Code 404}}<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
    {{else if eq .Code 403}}<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    {{else}}<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>{{end}}
  </span>
  <span class="errpage__code num">{{.Code}}</span>
  <h2>{{.Title}}</h2><p>{{.Text}}</p>
  <div class="errpage__actions"><a class="btn btn-primary" href="{{.P}}/recipes">{{t .L "page.foot.recipes"}}</a><a class="btn btn-soft" href="/">{{t .L "page.err.home"}}</a></div>
</div></div>
{{template "foot" .}}
